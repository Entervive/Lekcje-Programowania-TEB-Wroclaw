<!doctype html>
<html lang="pl-PL">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styl8.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fryzjerstwo</title>
  </head>
  <body>
    <section class="lewy-pierwszy" id="lewy">
      <h1><a href="index.html">SALON FRYZJERSKI</a></h1>
    </section>
    <section id="prawy">
      <h4><a href="fryzura.html">Ceny strzyżenia</a></h4>
      <table>
        <tr>
          <th>Długość włosów</th>
          <th>Cena</th>
        </tr>
        <tr>
          <td>Krótkie</td>
          <td>25</td>
        </tr>
        <tr>
          <td>Średnie</td>
          <td>30</td>
        </tr>
        <tr>
          <td>Półdługie</td>
          <td>40</td>
        </tr>
        <tr>
          <td>Długie</td>
          <td>50</td>
        </tr>
      </table>
    </section>
    <section class="lewy-drugi" id="lewy">
      <h4>PROMOCJA!</h4>
      <input type="radio" name="dlugoscWlosa" id="dlugoscWlosaK" value="25" />
      <label for="dlugoscWlosa">Krótkie</label><br />
      <input type="radio" name="dlugoscWlosa" id="dlugoscWlosaS" value="30" />
      <label for="dlugoscWlosa">Średnie</label><br />
      <input type="radio" name="dlugoscWlosa" id="dlugoscWlosaP" value="40" />
      <label for="dlugoscWlosa"> Półdługie</label><br />
      <input type="radio" name="dlugoscWlosa" id="dlugoscWlosaD" value="50" />
      <label for="dlugoscWlosa">Długie</label><br />
      <button onclick="promocja()">Odkryj promocję</button>
      <p id="wynik"></p>
    </section>

    <section id="prawy">
      <img src="obraz1.jpg" alt="Fryzjerka" />
    </section>
    <section id="lewy">
      <p>Witaj! Miło nam, że odwiedziłeś nasz salon. Sprawdź promocje!</p>
      <h4>Kontakt: 444 555 666</h4>
    </section>
    <footer>
      <p>Autor: &copf; Aleksander Staszków</p>
    </footer>
  </body>
  <script>
    function promocja() {
      let dlugoscK = document.getElementById("dlugoscWlosaK");
      let dlugoscS = document.getElementById("dlugoscWlosaS");
      let dlugoscP = document.getElementById("dlugoscWlosaP");
      let dlugoscD = document.getElementById("dlugoscWlosaD");
      let blokDrugi = document.getElementById("wynik");
      let cena = 0;

      if (dlugoscK.checked) {
        cena = dlugoscK.value - 10;
        blokDrugi.innerHTML = "<p>cena promocyjna: " + cena + "</p>";
      } else if (dlugoscS.checked) {
        cena = dlugoscS.value - 10;
        blokDrugi.innerHTML = "<p>cena promocyjna: " + cena + "</p>";
      } else if (dlugoscP.checked) {
        cena = dlugoscP.value - 10;
        blokDrugi.innerHTML = "<p>cena promocyjna: " + cena + "</p>";
      } else if (dlugoscD.checked) {
        cena = dlugoscD.value - 10;
        blokDrugi.innerHTML = "<p>cena promocyjna: " + cena + "</p>";
      }
    }
  </script>
</html>
